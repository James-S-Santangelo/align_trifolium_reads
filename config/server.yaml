# ──────────────────────────────────────────────────────────────────────────────
# Pipeline configuration
# ──────────────────────────────────────────────────────────────────────────────

# Path to sample metadata TSV (must contain columns: sample, cov_cat)
samples_file: "all_clover_samples.txt"

# Root directory to search recursively for FASTQs.
# FASTQs must be named {sample}_*R1*.fastq.gz / {sample}_*R2*.fastq.gz
fastq_dir: "/path/to/fastqs"

# Reference genome (indexed with bwa index and samtools faidx)
reference: "/path/to/reference.fa"

# Output
results_prefix: "/scratch/santang3/align_trifolium_reads/results"
log_prefix: "/scratch/santang3/align_trifolium_reads/logs"

# ──────────────────────────────────────────────────────────────────────────────
# Tool settings
# ──────────────────────────────────────────────────────────────────────────────

bwa:
  extra_flags: "-Y"                 # soft-clip supplementary alignments

fastp:
  min_length: 36
  quality: 20
  extra_flags: "--detect_adapter_for_pe"

markdup:
  optical_duplicate_pixel_distance: 2500   # NovaSeq patterned flowcell

mosdepth:
  quantize: "0:1:5:10:20:50:"      # coverage bin boundaries for quantized output
  min_mapq: 1

# ──────────────────────────────────────────────────────────────────────────────
# Resources by coverage category
# ──────────────────────────────────────────────────────────────────────────────

resources:
  high:
    threads_align: 16
    threads_sort: 8
    threads_markdup: 4
    threads_mosdepth: 4
    mem_mb_align: 24000
    mem_mb_sort: 8000       # per-thread; samtools sort -m
    mem_mb_markdup: 16000
  low:
    threads_align: 8
    threads_sort: 4
    threads_markdup: 2
    threads_mosdepth: 2
    mem_mb_align: 12000
    mem_mb_sort: 4000
    mem_mb_markdup: 8000