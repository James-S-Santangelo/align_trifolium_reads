# ──────────────────────────────────────────────────────────────────────────────
# Pipeline configuration
# ──────────────────────────────────────────────────────────────────────────────

# Path to sample metadata TSV (must contain columns: sample, cov_cat)
# samples_file: "../resources/all_clover_samples.txt"
samples_file: "../resources/all_clover_samples.txt"

# Root directory to search recursively for FASTQs.
# FASTQs must be named {sample}_*R1*.fastq.gz / {sample}_*R2*.fastq.gz
# fastq_dir: "/home/santang3/projects/def-santang3/raw_data/clover_gwas" # Narval
fastq_dir: "/archive/raw_data/fastq/" # Nepenthes

# Reference genome (indexed with bwa index and samtools faidx)
# reference: "/home/santang3/projects/def-santang3/refs/trifolium/UTM_Trep_v1.0/GCA_030408175.1_UTM_Trep_v1.0_genomic.fna" # (Narval)
reference: "/scratch/references/trifolium/repens/UTM_Trep_v1.0/GCA_030914245.1_UTM_Trep_v1.0_hap1_genomic.fna" # (Npenethes)

# Output
results_prefix: "/archive/align_trifolium_reads"

# Scratch space for sambamba sort temporary files
# tmpdir: "$SLURM_TMPDIR" # Narval
tmpdir: "/tmp" # Nepenthes

# ──────────────────────────────────────────────────────────────────────────────
# Resources by coverage category
# ──────────────────────────────────────────────────────────────────────────────

resources:
  high:
    threads_bwa: 16       # mem_mb = threads * 2000 = 32,000 MB
    threads_sort: 8       # mem_mb = threads * 4000 = 32,000 MB (passed as total to sambamba)
    threads_markdup: 4
    runtime_merge: 480
    mem_mb_markdup: 16000
  low:
    threads_bwa: 8        # mem_mb = threads * 2000 = 16,000 MB
    threads_sort: 8       # mem_mb = threads * 4000 = 16,000 MB
    threads_markdup: 4
    runtime_merge: 240
    mem_mb_markdup: 8000
 
